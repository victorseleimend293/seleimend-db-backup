apiVersion: batch/v1
kind: CronJob
metadata:
  name: seleimend-db-backup
  namespace: default
  labels:
    app.kubernetes.io/name: seleimend-db-backup
    app.kubernetes.io/part-of: seleimend-infrastructure
    app.kubernetes.io/component: backup
spec:
  # Run daily at 02:00 UTC
  schedule: "0 2 * * *"
  # Never run multiple backup jobs concurrently
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: seleimend-db-backup
        spec:
          restartPolicy: OnFailure
          # Security: Run as non-root user (UID 10001)
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/victorseleimend293/seleimend-db-backup:latest
              imagePullPolicy: IfNotPresent
              args: ["backup"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - secretRef:
                    name: seleimend-db-backup-secret
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
