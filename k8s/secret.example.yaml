apiVersion: v1
kind: Secret
metadata:
  name: seleimend-db-backup-secret
  namespace: default
  labels:
    app.kubernetes.io/name: seleimend-db-backup
type: Opaque
stringData:
  # ============================================================================
  # Backblaze B2 S3 API Credentials
  # ============================================================================
  # B2_ENDPOINT: The S3 API endpoint provided in your Backblaze B2 bucket details
  # Example: s3.us-west-004.backblazeb2.com or s3.us-east-005.backblazeb2.com
  B2_ENDPOINT: 's3.us-west-004.backblazeb2.com'

  # Scoped Application Key ID with Read and Write permissions for B2_BUCKET
  B2_APPLICATION_KEY_ID: 'your-b2-application-key-id'

  # Application Key (secret)
  B2_APPLICATION_KEY: 'your-b2-application-key'

  # Dedicated B2 bucket name
  B2_BUCKET: 'seleimend-db-backups'

  # Folder path inside the bucket (default: backups/postgres)
  B2_PREFIX: 'production/postgres'

  # ============================================================================
  # Target Database Connection
  # ============================================================================
  # Either provide a full PostgreSQL connection URI:
  DATABASE_URL: 'postgresql://postgres_user:strong_password@postgres.default.svc.cluster.local:5432/production_db'

  # Or provide individual connection variables:
  # DB_HOST: "postgres.default.svc.cluster.local"
  # DB_PORT: "5432"
  # DB_NAME: "production_db"
  # DB_USER: "postgres_user"
  # DB_PASSWORD: "strong_password"

  # ============================================================================
  # Schedules (for single-service deployment via supercronic)
  # ============================================================================
  # Backup schedule (cron syntax, default: daily at 02:00 UTC)
  CRON_SCHEDULE: '0 2 * * *'

  # Disaster recovery drill schedule (cron syntax, default: weekly on Sunday at 04:00 UTC)
  DR_SCHEDULE: '0 4 * * 0'

  # ============================================================================
  # Optional Operational Policies (Auto-Provisioned via Terraform)
  # ============================================================================
  # Storage retention in days applied automatically to B2 Bucket Lifecycle Rules
  RETENTION_DAYS: '30'

  # Enable Backblaze B2 default server-side encryption (SSE-B2 with AES256)
  ENABLE_B2_ENCRYPTION: 'true'

  # Unified healthcheck webhook URL (Healthchecks.io, Dead Man's Snitch, BetterStack)
  # Receives /start, success, and /fail for both scheduled backups and DR drills
  # HEALTHCHECK_URL: "https://hc-ping.com/your-uuid"

  # Required custom SQL query to assert database validity during DR tests
  DR_VERIFY_QUERY: "SELECT count(*) FROM users WHERE status = 'active';"
